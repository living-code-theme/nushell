name: check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: 12.9.0, run_install: false }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: living-code-nushell
          path: dist/*.tar.gz
          if-no-files-found: error
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Fetch checksum-pinned Nushell 0.116.1
        run: |
          curl --fail --location --max-time 90 https://github.com/nushell/nushell/releases/download/0.116.1/nu-0.116.1-x86_64-unknown-linux-musl.tar.gz -o native.tar.gz
          echo '13ef75df08df30f8d7b031df538e82a52c6e74ce839b1a9091c3a3f1969c3742  native.tar.gz' | sha256sum --check -
          mkdir native && tar -xzf native.tar.gz -C native
      - name: Import all four native modules
        run: NU_BINARY="$PWD/native/nu-0.116.1-x86_64-unknown-linux-musl/nu" node scripts/test-native.mjs
